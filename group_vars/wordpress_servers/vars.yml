---

# connection
ansible_become_password: "{{ vault_become_password }}"

# site information
wp_site_url: "https://10.2.37.98"
wp_site_title: "CS320 WordPress Lab"
wp_locale: "en_US"

# administrator
wp_admin_user: "wpadmin"
wp_admin_email: "joe@example.com"
wp_admin_password: "{{ vault_wp_admin_password }}"

#  database
wp_db_name: "wordpress"
wp_db_user: "wp_user"
wp_db_host: "localhost"
wp_db_password: "{{ vault_wp_db_password }}"

#  application account 
wp_app_user: "wordpress"
wp_app_group: "www-data"

# paths
wp_install_dir: "/var/www/wordpress"
wp_cli_path: "/usr/local/bin/wp"
ssl_cert_path: "/etc/ssl/certs/wordpress.crt"
ssl_key_path: "/etc/ssl/private/wordpress.key"

# webserver and php 
nginx_server_name: "10.2.37.98"
php_version: "8.3"

# worpress plugins
wp_plugins:
  - classic-editor
  - duplicate-post

# deploy 
wp_site_tagline: "Deployed with Ansible"
wp_timezone: "America/Detroit"
wp_permalink_structure: "/%postname%/"

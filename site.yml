---
- name: Deploy wp on lemp stack
  hosts: wordpress_servers
  become: true 

  pre_tasks:
    - name: Verify the target OS is supported
      ansible.builtin.assert:
        that: ansible_facts['os_family'] in ['Debian', 'RedHat']
        success_msg: "{{ ansible_facts['distribution'] }} is supported"
        fail_msg: "Unsupported OS family: {{ ansible_facts['os_family'] }}"

  roles: 
   - stack_install
   - stack_config
   - wordpress 
 

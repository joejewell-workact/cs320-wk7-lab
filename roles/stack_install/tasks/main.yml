---
- name: Load distribution-specific variables
  ansible.builtin.include_vars:
    file: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts['os_family'] | lower }}.yml"
        - default.yml
      paths:
        - vars

- name: Install LEMP stack and WordPress dependencies (Debian)
  ansible.builtin.apt:
    name: "{{ stack_install_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

- name: Install LEMP stack and WordPress dependencies (RedHat)
  ansible.builtin.dnf:
    name: "{{ stack_install_packages }}"
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "RedHat"

- name: Install WP-CLI
  ansible.builtin.get_url:
    url: "{{ stack_install_wpcli_url }}"
    dest: "{{ wp_cli_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Verify WP-CLI runs
  ansible.builtin.command: "{{ wp_cli_path }} cli version --allow-root"
  register: stack_install_wpcli_version
  changed_when: false

- name: Show WP-CLI version
  ansible.builtin.debug:
    msg: "{{ stack_install_wpcli_version.stdout }}"
